name: Update Google Scholar Stats

on:
  schedule:
    # Run weekly on Sundays at 2:00 AM UTC
    - cron: '0 2 * * 0'
  push:
    branches: [ main ]
  workflow_dispatch:  # Allow manual trigger

jobs:
  update-scholar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write

    steps:
    - name: Checkout main branch
      uses: actions/checkout@v3
      with:
        ref: main

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r google_scholar_crawler/requirements.txt

    - name: Test basic setup
      timeout-minutes: 2
      continue-on-error: true
      run: |
        echo "🧪 Testing basic setup..."
        python -u google_scholar_crawler/test_simple.py || echo "❌ Test failed"
        echo "✅ Test completed"
        
    - name: Run Google Scholar crawler
      timeout-minutes: 5
      run: |
        echo "🚀 Starting Google Scholar crawler..."
        cd google_scholar_crawler
        python -u simple_crawler.py
      env:
        GOOGLE_SCHOLAR_ID: "5biMMmIAAAAJ"

    - name: Validate fetched data
      run: |
        python - <<'PY'
        import json
        from pathlib import Path

        results = Path("google_scholar_crawler/results")
        with (results / "gs_data.json").open(encoding="utf-8") as handle:
            data = json.load(handle)
        with (results / "gs_data_shieldsio.json").open(encoding="utf-8") as handle:
            badge = json.load(handle)

        if not isinstance(data.get("publications"), dict) or not data["publications"]:
            raise SystemExit("Fetched Scholar data has no publications; refusing to publish it.")
        if not isinstance(data.get("citedby"), int) or data["citedby"] < 0:
            raise SystemExit("Fetched Scholar data has an invalid citation count; refusing to publish it.")
        if badge.get("message") != str(data["citedby"]):
            raise SystemExit("Citation badge does not match fetched Scholar data; refusing to publish it.")
        print(f"Validated {len(data['publications'])} publications and {data['citedby']} citations.")
        PY

    - name: Stage validated Scholar data
      run: |
        mkdir -p google-scholar-stats
        cp google_scholar_crawler/results/gs_data.json google-scholar-stats/
        cp google_scholar_crawler/results/gs_data_shieldsio.json google-scholar-stats/

    - name: Push to google-scholar-stats branch
      run: |
        echo "🚀 Starting git operations..."
        cd google-scholar-stats
        echo "📁 Changed to google-scholar-stats directory"
        echo "🔧 Initializing git repository..."
        git init
        echo "👤 Setting git user..."
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        echo "📋 Adding files to git..."
        git add *.json
        echo "💾 Committing changes..."
        git commit -m "Update Google Scholar stats - $(date '+%Y-%m-%d')"
        echo "🚀 Pushing to google-scholar-stats branch..."
        git push --force https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git HEAD:google-scholar-stats
        echo "✅ Successfully pushed to google-scholar-stats branch!"
