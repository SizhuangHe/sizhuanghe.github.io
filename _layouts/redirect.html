<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>{{ site.title }}</title>
<meta name="robots" content="noindex">
<link rel="canonical" href="{{ site.canonical }}{{ page.redirect_to | remove_first: '/' }}">
<meta http-equiv="refresh" content="0; url={{ page.redirect_to | relative_url }}">
<script>location.replace({{ page.redirect_to | relative_url | jsonify }})</script>
</head>
<body></body>
</html>
